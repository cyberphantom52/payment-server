[package]
name = "payment-server"
version = "0.1.0"
edition = "2024"
default-run = "payment-server"

[[bin]]
name = "payment-server"
path = "src/main.rs"

[[bin]]
name = "payment-provider"
path = "src/bin/payment_service_provider.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "tls-rustls",
    "chrono",
] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1.23.4", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
